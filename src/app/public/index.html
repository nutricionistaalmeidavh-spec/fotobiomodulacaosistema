<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>ArtiSys Fotobiomodulação — F10</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/f6-f7.css">
</head>
<body>
  <main id="auth-root" class="auth-stage" aria-live="polite"></main>

  <div id="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">PBM</span>
        <div><strong>ArtiSys Fotobiomodulação</strong><small>Workspace clínico local</small></div>
      </div>
      <nav class="topnav" aria-label="Módulos clínicos">
        <button data-nav="dashboard" class="is-active">Dashboard</button>
        <button data-nav="patients">Pacientes</button>
        <button data-nav="protocols">Protocolos</button>
        <button data-nav="equipment">Equipamentos</button>
        <button data-nav="sessions">Sessões</button>
        <button data-nav="agenda">Agenda</button>
        <button data-nav="finance">Financeiro</button>
        <button data-nav="reports">Relatórios</button>
        <button data-nav="audit">Auditoria</button>
        <button data-nav="admin" hidden>Administração</button>
      </nav>
      <div class="account-chip">
        <span data-auth-user></span>
        <button class="secondary compact" data-logout>Sair</button>
      </div>
    </header>

    <main class="shell">
      <section class="hero">
        <div>
          <span class="eyebrow">FASE 10 · MULTI-PROFISSIONAL E ROBUSTEZ</span>
          <h1>Papéis, permissões, integridade e operação administrativa local</h1>
          <p>Administrador, profissional e recepção usam permissões distintas validadas no servidor. O roadmap funcional encerra nesta fase.</p>
        </div>
        <span class="phase-badge" data-phase-badge>Carregando…</span>
      </section>

      <div id="flash" class="flash" role="status" hidden></div>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>

  <script>
    (() => {
      let lastLoginEmail = '';
      const root = document.querySelector('#auth-root');
      document.addEventListener('input', (event) => {
        if (event.target?.matches?.('[name="login-email"]')) lastLoginEmail = event.target.value;
      }, true);
      new MutationObserver(() => {
        const input = root.querySelector('[name="login-email"]');
        if (input && !input.value && lastLoginEmail) input.value = lastLoginEmail;
      }).observe(root, { childList: true, subtree: true });
    })();
  </script>
  <script type="module" src="/f10-bootstrap.js"></script>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/f2-ui.js"></script>
  <script type="module" src="/f3-ui.js"></script>
  <script type="module" src="/f4-ui.js"></script>
  <script type="module" src="/f5-ui.js"></script>
  <script type="module" src="/f6-ui.js"></script>
  <script type="module" src="/f7-ui.js"></script>
  <script type="module" src="/f8-ui.js"></script>
  <script type="module" src="/f9-ui.js"></script>
  <script type="module" src="/f10-ui.js"></script>
</body>
</html>
